name: ASTRA STATISTICAL REALITY CHECK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/statistical-reality-check.yml"
      - "scripts/statistical_reality_check_ci.py"
      - "astra/**"
      - "data/real/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/statistical_reality_check_ci.py
      - name: Persist statistical evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/statistical_reality_check_ci.json
          git diff --cached --quiet || git commit -m "evidence(astra): persist statistical reality check [skip ci]"
          git push
