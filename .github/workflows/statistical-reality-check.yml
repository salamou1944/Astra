name: ASTRA STATISTICAL REALITY CHECK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/statistical-reality-check.yml"
      - "scripts/statistical_reality_check_ci.py"
      - "astra/**"
      - "data/real/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/statistical_reality_check_ci.py
      - name: Archive statistical evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-statistical-reality-check
          path: evidence/statistical_reality_check_ci.json
