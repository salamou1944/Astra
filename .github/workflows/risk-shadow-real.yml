name: ASTRA REAL_DATA RISK SHADOW
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/risk-shadow-real.yml"
      - "scripts/risk_shadow_real_data_ci.py"
      - "evidence/real_data_research_ci.json"
      - "data/real/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  risk-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python scripts/risk_shadow_real_data_ci.py
      - name: Persist risk/shadow evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/real_data_risk_shadow_ci.json
          git diff --cached --quiet || git commit -m "evidence(astra): persist real-data risk shadow run [skip ci]"
          git push
