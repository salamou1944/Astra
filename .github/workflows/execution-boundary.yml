name: ASTRA EXECUTION PREFLIGHT
on:
  push:
    branches: [main]
    paths:
      - "astra/execution/**"
      - "astra/data.py"
      - "tests/test_*execution*.py"
      - "scripts/execution_boundary_check.py"
      - "scripts/execution_live_preflight.py"
      - ".github/workflows/execution-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Execution tests
        run: python -m unittest discover -s tests -p "test_*execution*.py" -v
      - name: Data and execution regression
        run: python -m unittest discover -s tests -p "test_data*.py" -v
      - name: Offline boundary
        run: python scripts/execution_boundary_check.py
      - name: Non-trading preflight
        run: python scripts/execution_live_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: astra-execution-preflight-evidence
          path: evidence/execution_*.json
