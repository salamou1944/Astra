name: ASTRA INDEPENDENT SOURCE VALIDATION
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-source-validation.yml"
      - "scripts/independent_source_validation_ci.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate independent market source
        run: python scripts/independent_source_validation_ci.py
      - name: Persist evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/independent_source_validation_ci.json
          git diff --cached --quiet || git commit -m "evidence(astra): validate independent market source [skip ci]"
          git push
