name: ASTRA INDEPENDENT SOURCE VALIDATION
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-source-validation.yml"
      - "scripts/independent_source_validation_ci.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate independent market source
        run: python scripts/independent_source_validation_ci.py
      - name: Archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-independent-source-validation
          path: evidence/independent_source_validation_ci.json
