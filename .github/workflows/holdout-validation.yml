name: ASTRA REAL DATA HOLDOUT VALIDATION
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/holdout-validation.yml"
      - "scripts/holdout_validation_ci.py"
      - "data/real/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      # refreshed after holdout benchmark patch
      - run: python scripts/holdout_validation_ci.py
      - name: Persist evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/holdout_validation_ci.json
          git diff --cached --quiet || git commit -m "evidence(astra): persist untouched real-data holdout [skip ci]"
          git push
